# Aumentar a memória disponível para o Gradle para evitar OutOfMemoryError
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Ativar build paralelo e cache para performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX e Jetifier (necessário para bibliotecas mais antigas)
android.useAndroidX=true
android.enableJetifier=true
